apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-api
  namespace: devops-lab
  labels:
    app: uptime-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uptime-api
  template:
    metadata:
      labels:
        app: uptime-api
    spec:
      containers:
        - name: uptime-api
          image: ghcr.io/horvath-szilard/uptime-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: APP_ENV
              value: homelab
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10